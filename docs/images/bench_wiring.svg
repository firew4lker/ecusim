<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="980" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- PC -->
  <rect x="20" y="70" width="190" height="120" rx="8" fill="#eef3fb" stroke="#3a5a8c" stroke-width="2"/>
  <text x="115" y="100" text-anchor="middle" font-weight="bold">PC</text>
  <text x="115" y="125" text-anchor="middle">ECU simulator</text>
  <text x="115" y="145" text-anchor="middle" font-size="12" fill="#444">ecusim / ecusim headless</text>
  <text x="115" y="172" text-anchor="middle" font-size="12" fill="#444">Linux · Windows · macOS</text>

  <!-- USB -->
  <line x1="210" y1="130" x2="268" y2="130" stroke="#555" stroke-width="3"/>
  <text x="239" y="120" text-anchor="middle" font-size="12" fill="#444">USB</text>

  <!-- Adapter -->
  <rect x="270" y="80" width="200" height="100" rx="8" fill="#fdf3e6" stroke="#b36b00" stroke-width="2"/>
  <text x="370" y="110" text-anchor="middle" font-weight="bold">USB–CAN adapter</text>
  <text x="370" y="132" text-anchor="middle" font-size="12">CANable / PCAN / Kvaser</text>
  <text x="370" y="152" text-anchor="middle" font-size="12" fill="#444">candleLight → socketcan, gs_usb</text>
  <text x="370" y="168" text-anchor="middle" font-size="12" fill="#444">slcan → ttyACM / COM</text>

  <!-- CAN pair -->
  <line x1="470" y1="115" x2="600" y2="115" stroke="#c0392b" stroke-width="3"/>
  <line x1="470" y1="145" x2="600" y2="145" stroke="#2c6fbb" stroke-width="3"/>
  <text x="527" y="107" text-anchor="middle" font-size="12" fill="#c0392b">CAN-H → pin 6</text>
  <text x="527" y="165" text-anchor="middle" font-size="12" fill="#2c6fbb">CAN-L → pin 14</text>
  <!-- termination at adapter end -->
  <rect x="485" y="121" width="22" height="18" fill="#fff" stroke="#333"/>
  <text x="496" y="134" text-anchor="middle" font-size="9">120Ω</text>
  <line x1="496" y1="115" x2="496" y2="121" stroke="#333"/>
  <line x1="496" y1="139" x2="496" y2="145" stroke="#333"/>
  <text x="496" y="196" text-anchor="middle" font-size="11" fill="#444">termination</text>
  <text x="496" y="210" text-anchor="middle" font-size="11" fill="#444">(jumper on CANable)</text>

  <!-- OBD connector -->
  <rect x="600" y="40" width="230" height="200" rx="14" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="715" y="64" text-anchor="middle" font-weight="bold">OBD-II female (J1962)</text>
  <g font-size="12">
    <!-- top row pins 1-8 -->
    <g>
      <circle cx="630" cy="100" r="11" fill="#fff" stroke="#999"/><text x="630" y="104" text-anchor="middle">1</text>
      <circle cx="657" cy="100" r="11" fill="#fff" stroke="#999"/><text x="657" y="104" text-anchor="middle">2</text>
      <circle cx="684" cy="100" r="11" fill="#fff" stroke="#999"/><text x="684" y="104" text-anchor="middle">3</text>
      <circle cx="711" cy="100" r="11" fill="#333"/><text x="711" y="104" text-anchor="middle" fill="#fff">4</text>
      <circle cx="738" cy="100" r="11" fill="#333"/><text x="738" y="104" text-anchor="middle" fill="#fff">5</text>
      <circle cx="765" cy="100" r="11" fill="#c0392b"/><text x="765" y="104" text-anchor="middle" fill="#fff">6</text>
      <circle cx="792" cy="100" r="11" fill="#fff" stroke="#999"/><text x="792" y="104" text-anchor="middle">7</text>
      <circle cx="819" cy="100" r="11" fill="#fff" stroke="#999"/><text x="819" y="104" text-anchor="middle">8</text>
    </g>
    <g>
      <circle cx="630" cy="140" r="11" fill="#fff" stroke="#999"/><text x="630" y="144" text-anchor="middle">9</text>
      <circle cx="657" cy="140" r="11" fill="#fff" stroke="#999"/><text x="657" y="144" text-anchor="middle">10</text>
      <circle cx="684" cy="140" r="11" fill="#fff" stroke="#999"/><text x="684" y="144" text-anchor="middle">11</text>
      <circle cx="711" cy="140" r="11" fill="#fff" stroke="#999"/><text x="711" y="144" text-anchor="middle">12</text>
      <circle cx="738" cy="140" r="11" fill="#fff" stroke="#999"/><text x="738" y="144" text-anchor="middle">13</text>
      <circle cx="765" cy="140" r="11" fill="#2c6fbb"/><text x="765" y="144" text-anchor="middle" fill="#fff">14</text>
      <circle cx="792" cy="140" r="11" fill="#fff" stroke="#999"/><text x="792" y="144" text-anchor="middle">15</text>
      <circle cx="819" cy="140" r="11" fill="#e67e22"/><text x="819" y="144" text-anchor="middle" fill="#fff">16</text>
    </g>
    <text x="612" y="185" font-size="12">4/5 ground · 6 CAN-H · 14 CAN-L</text>
    <text x="612" y="203" font-size="12">16 +12 V (powers the scan tool)</text>
    <text x="612" y="221" font-size="12" fill="#444">all other pins unused</text>
  </g>

  <!-- Scan tool -->
  <rect x="860" y="70" width="105" height="140" rx="10" fill="#eaf7ee" stroke="#2e8b57" stroke-width="2"/>
  <text x="912" y="105" text-anchor="middle" font-weight="bold">Scan</text>
  <text x="912" y="123" text-anchor="middle" font-weight="bold">tool</text>
  <text x="912" y="150" text-anchor="middle" font-size="11">handheld,</text>
  <text x="912" y="166" text-anchor="middle" font-size="11">ELM327,</text>
  <text x="912" y="182" text-anchor="middle" font-size="11">OBDLink …</text>
  <line x1="858" y1="120" x2="832" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="912" y="232" text-anchor="middle" font-size="11" fill="#444">plugs in here</text>

  <!-- Bench supply -->
  <rect x="600" y="300" width="230" height="80" rx="8" fill="#fff7f0" stroke="#e67e22" stroke-width="2"/>
  <text x="715" y="330" text-anchor="middle" font-weight="bold">12 V bench supply</text>
  <text x="715" y="352" text-anchor="middle" font-size="12">(or a 12 V wall adapter, ≥1 A)</text>
  <polyline points="830,340 845,340 845,165 819,165 819,152" fill="none" stroke="#e67e22" stroke-width="2.5"/>
  <text x="855" y="300" font-size="12" fill="#e67e22">+12 V → pin 16</text>
  <polyline points="600,340 585,340 585,82 738,82" fill="none" stroke="#333" stroke-width="2.5"/><line x1="711" y1="82" x2="711" y2="89" stroke="#333" stroke-width="2.5"/><line x1="738" y1="82" x2="738" y2="89" stroke="#333" stroke-width="2.5"/>
  <text x="578" y="330" font-size="12" text-anchor="end">0 V → pins 4 + 5</text>
  
  <text x="20" y="300" font-size="13" fill="#333">Bus wiring: twisted pair, CAN-H to pin 6, CAN-L to pin 14.</text>
  <text x="20" y="322" font-size="13" fill="#333">Terminate both ends of the bus with 120 Ω</text>
  <text x="20" y="344" font-size="13" fill="#333">(about 60 Ω measured between pins 6 and 14 with power off).</text>
  <text x="20" y="366" font-size="13" fill="#333">Connect the adapter's ground to pin 4/5 as well.</text>
  <text x="20" y="400" font-size="12" fill="#666">Bitrate: 500 kbit/s, 11-bit identifiers (the default), as on most cars since 2008.</text>
</svg>
