[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecusim"
version = "0.1.0"
description = "Engine control module simulator with generic OBD-II over CAN"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "firewalker" }]
requires-python = ">=3.11"
dependencies = ["python-can>=4.3", "msgpack", "pyserial", "PySide6>=6.6", "pyqtgraph>=0.13", "numpy",
                "jeepney; sys_platform == 'linux'"]  # jeepney: Bluetooth ELM327 emulation through BlueZ

[project.scripts]
ecusim = "ecusim.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
can = ["python-can>=4.3"]
dev = ["pytest>=8", "obd"]  # obd (python-OBD): end-to-end test of the ELM327 emulation

[tool.setuptools.packages.find]
include = ["ecusim*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
